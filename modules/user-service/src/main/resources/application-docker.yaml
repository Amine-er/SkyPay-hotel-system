spring:
  application:
    name: user-service

  flyway:
    enabled: true
    schemas: schema_user
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    url: jdbc:postgresql://postgres:5432/hotel
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          default_schema: schema_user
          dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/