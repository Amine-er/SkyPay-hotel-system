spring:
  application:
    name: room-service

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: schemaroom
    locations: classpath:db/migration

  datasource:
    url: jdbc:postgresql://localhost:5432/shared_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: schemaroom
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/