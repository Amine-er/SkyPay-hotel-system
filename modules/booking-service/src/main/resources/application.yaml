spring:
  application:
    name: booking-service

  data:
    mongodb:
      host: localhost
      port: 27017
      database: bookingdb
      username: bookinguser
      password: bookingpass

server:
  port: 8083
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: true
    path: /api/bookings/openapi/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/bookings/openapi/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  service:
    url: http://localhost:8080/api/payments/check-balance

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/