spring:
  application:
    name: booking-service

  data:
    mongodb:
      host: localhost
      port: 27017
      database: bookingdb
      username: bookinguser
      password: bookingpass

server:
  port: 8083
  forward-headers-strategy: framework

springdoc:
  swagger-ui.path: /openapi/swagger-ui.html
  api-docs.path: /openapi/v3/api-docs
  pathsToMatch: /**

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  service:
    url: http://localhost:8084/payment/check-balance

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/