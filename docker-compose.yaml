services:
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin-skypay
    ports:
      - "9411:9411"
    networks:
      - SkyPay-net

  mongo:
    image: mongo:5.0.27
    container_name: mongo-skypay
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: bookingdb
    volumes:
      - ./api-common/docker/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - SkyPay-net

  postgres:
    image: postgres:15.13
    container_name: postgres-skypay
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./api-common/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - SkyPay-net

  frontend:
    image: med29/skypay-hotel-ui:latest
    container_name: frontend-skypay
    ports:
      - "3000:3000"
    networks:
      - SkyPay-net

  eureka-server:
    image: med29/skypay-hotel-eureka-server:latest
    container_name: eureka-server-skypay
    ports:
      - "8761:8761"
    networks:
      - SkyPay-net

  config-server:
    image: med29/skypay-hotel-config-server:latest
    container_name: config-server-skypay
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - SkyPay-net

  spring-admin-server:
    image: med29/skypay-hotel-spring-admin-server:latest
    container_name: admin-server-skypay
    ports:
      - "7070:7070"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - SkyPay-net

  api-gateway:
    image: med29/skypay-hotel-api-gateway:latest
    container_name: api-gateway-skypay
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - SkyPay-net

  user-service:
    image: med29/skypay-hotel-user-service:latest
    container_name: user-service-skypay
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - SkyPay-net

  room-service:
    image: med29/skypay-hotel-room-service:latest
    container_name: room-service-skypay
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - SkyPay-net

  booking-service:
    image: med29/skypay-hotel-booking-service:latest
    container_name: booking-service-skypay
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - SkyPay-net

  payment-service-mock:
    image: med29/skypay-hotel-payment-service-mock:latest
    container_name: payment-service-skypay
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - SkyPay-net

networks:
  SkyPay-net:
    driver: bridge
